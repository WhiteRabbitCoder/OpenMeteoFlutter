name: open_meteo_flutter
description: Modern Flutter weather app using Open-Meteo APIs.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_riverpod: ^2.6.1
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  intl: ^0.20.2
  lottie: ^3.3.1
  rive: ^0.13.20
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
